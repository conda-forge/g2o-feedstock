schema_version: 1

context:
  version: "2024.12.28"
  tag: 20241228_git

recipe:
  name: g2o-split
  version: ${{ version }}

source:
  url: https://github.com/RainerKuemmerle/g2o/archive/refs/tags/${{ tag }}.tar.gz
  sha256: d691ead69184ebbb8256c9cd9f4121d1a880b169370efc0554dd31a64802a452
  patches:
    - patches/0001-use-eigen-config.patch
    - patches/0002-keep-viewer-out-of-core-export.patch

outputs:
  - staging:
      name: g2o-build
    build:
      script:
        env:
          G2O_OPENGL: ${{ "OFF" if linux and aarch64 else "ON" }}
        content:
          - if: win
            then: |
              cmake -G Ninja ^
                %CMAKE_ARGS% ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% ^
                -DBUILD_SHARED_LIBS=ON ^
                -DBUILD_UNITTESTS=OFF ^
                -DBUILD_WITH_MARCH_NATIVE=OFF ^
                -DDO_SSE_AUTODETECT=OFF ^
                -DG2O_BUILD_APPS=ON ^
                -DG2O_BUILD_BENCHMARKS=OFF ^
                -DG2O_BUILD_EXAMPLES=OFF ^
                -DG2O_BUILD_LINKED_APPS=OFF ^
                -DG2O_USE_LOGGING=OFF ^
                -DG2O_USE_OPENGL=%G2O_OPENGL% ^
                -S %SRC_DIR% -B build
              cmake --build build --config Release --target install
            else: |
              cmake -G Ninja \
                ${CMAKE_ARGS} \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=${PREFIX} \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_UNITTESTS=OFF \
                -DBUILD_WITH_MARCH_NATIVE=OFF \
                -DDO_SSE_AUTODETECT=OFF \
                -DG2O_BUILD_APPS=ON \
                -DG2O_BUILD_BENCHMARKS=OFF \
                -DG2O_BUILD_EXAMPLES=OFF \
                -DG2O_BUILD_LINKED_APPS=OFF \
                -DG2O_USE_LOGGING=OFF \
                -DG2O_USE_OPENGL=${G2O_OPENGL} \
                -S ${SRC_DIR} -B build
              cmake --build build --config Release --target install
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
      host:
        - eigen
        - libblas
        - suitesparse
        - if: not (linux and aarch64)
          then:
            - libqglviewer
            - qt-main
        - if: linux and not aarch64
          then:
            - libgl-devel
            - libglu
      ignore_run_exports:
        from_package:
          - libqglviewer
          - qt-main

  - package:
      name: libg2o
    inherit: g2o-build
    build:
      number: 0
      files:
        include:
          - include/**
          - lib/**
          - Library/include/**
          - Library/lib/**
          - Library/bin/*.dll
        exclude:
          - include/g2o/apps/g2o_viewer/**
          - lib/*g2o_viewer*
          - Library/include/g2o/apps/g2o_viewer/**
          - Library/lib/*g2o_viewer*
          - Library/bin/*g2o_viewer*.dll
    requirements:
      run:
        - eigen
      run_exports:
        - ${{ pin_subpackage('libg2o', upper_bound='x.x.x') }}
    tests:
      - package_contents:
          include:
            - g2o/core/sparse_optimizer.h
            - g2o/apps/g2o_cli/g2o_common.h
          lib:
            - g2o_core
            - g2o_cli
            - g2o_solver_cholmod
            - g2o_solver_csparse
      - script:
          - if: unix
            then:
              - test -f ${PREFIX}/lib/cmake/g2o/g2oConfig.cmake
          - if: win
            then:
              - if not exist %LIBRARY_PREFIX%\lib\cmake\g2o\g2oConfig.cmake exit 1
    about:
      summary: Headless libraries for the g2o graph optimization framework
      description: >-
        Shared libraries, headers, and CMake metadata for g2o. The core package
        does not depend on Qt.

  - package:
      name: g2o
    inherit:
      from: g2o-build
      run_exports: false
    build:
      number: 0
      files:
        include:
          - bin/g2o*
          - include/g2o/apps/g2o_viewer/**
          - lib/*g2o_viewer*
          - Library/bin/g2o*.exe
          - Library/bin/*g2o_viewer*.dll
          - Library/include/g2o/apps/g2o_viewer/**
          - Library/lib/*g2o_viewer*
    requirements:
      run:
        - ${{ pin_subpackage('libg2o', exact=True) }}
        - if: not (linux and aarch64)
          then:
            - libqglviewer
            - qt-main
    tests:
      - package_contents:
          bin:
            - g2o
            - g2o_simulator2d
            - g2o_simulator3d
            - if: not (linux and aarch64)
              then: g2o_viewer
      - script:
          - g2o --help
    about:
      summary: Command-line applications for the g2o graph optimization framework
      description: >-
        Command-line optimizer and graph simulation applications built from g2o.

about:
  homepage: https://github.com/RainerKuemmerle/g2o
  license: BSD-3-Clause AND LGPL-3.0-or-later
  license_file:
    - doc/license-bsd.txt
    - doc/license-lgpl.txt
  summary: General framework for graph optimization
  description: >-
    g2o is an open-source C++ framework for optimizing graph-based nonlinear
    error functions.
  documentation: https://openslam-org.github.io/g2o.html
  repository: https://github.com/RainerKuemmerle/g2o

extra:
  recipe-maintainers:
    - seanyen
    - wolfv
